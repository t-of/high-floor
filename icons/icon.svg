<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0f1418"/>
  <defs>
    <clipPath id="bar1clip">
      <rect x="106" y="190" width="76" height="180" rx="14"/>
    </clipPath>
  </defs>
  <!-- floor line, shows through the gaps between bars -->
  <rect x="106" y="370" width="300" height="8" rx="4" fill="#7ee0b5"/>
  <!-- bar 1: the lowest person, lifted by a raised floor -->
  <g clip-path="url(#bar1clip)">
    <rect x="106" y="190" width="76" height="180" fill="#eceef3"/>
    <rect x="106" y="315" width="76" height="55" fill="#7ee0b5"/>
  </g>
  <!-- bar 2: tallest -->
  <rect x="218" y="140" width="76" height="230" rx="14" fill="#eceef3"/>
  <!-- bar 3: shorter -->
  <rect x="330" y="270" width="76" height="100" rx="14" fill="#eceef3"/>
</svg>
